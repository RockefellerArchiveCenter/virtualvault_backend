services:
  index:
    image: elasticsearch:9.4.1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      - node.name=elasticsearch
      - discovery.seed_hosts=elasticsearch
      - cluster.initial_master_nodes=elasticsearch
      - cluster.name=docker-cluster
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - http.cors.enabled=true
      - http.cors.allow-origin=http://localhost:3000
      - http.cors.allow-headers=Content-Type, Access-Control-Allow-Headers, Authorization, X-Requested-With
      - http.cors.allow-credentials=true
      - xpack.security.enabled=false
      - logger.level=ERROR
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data
    ports:
      - 9200:9200
  update:
    build: .
    entrypoint: ["httpd", "-D", "FOREGROUND"]
    depends_on:
      index:
          condition: service_healthy
    environment:
      - AS_BASEURL=https://as.dev.rockarch.org/api
      - AS_USERNAME=harnold
      - AS_PASSWORD=The Farmers Wife!
      - AS_CHUNK_SIZE=150
      - AS_REPO=2
      - ES_HOST=http://index:9200
      - ES_API_KEY=
      - ES_INDEX=default
      - LAST_FETCHED_FILEPATH=/code/config_volume/last_fetched_timestamp.txt
      - ASSETS_DIR=/var/www/assets
    volumes:
      - ./assets:/var/www/assets
      - ./config_volume:/code/config_volume
      - ./src:/code/src
    ports:
      - 8000:8000
      
volumes:
  elasticsearch: